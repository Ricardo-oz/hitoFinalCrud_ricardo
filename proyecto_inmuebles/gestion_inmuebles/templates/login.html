{% extends 'base.html' %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="card mx-auto shadow-sm" style="max-width: 420px;">
    <div class="card-body">
        <h2 class="h4 mb-3">Iniciar Sesión</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Ingresar</button>
        </form>
    </div>
</div>
{% endblock %}
