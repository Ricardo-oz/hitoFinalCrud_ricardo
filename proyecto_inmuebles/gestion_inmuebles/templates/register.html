{% extends 'base.html' %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<div class="card mx-auto shadow-sm" style="max-width: 560px;">
    <div class="card-body">
        <h2 class="h4 mb-3">Registro</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Registrarse</button>
        </form>
        <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
    </div>
</div>
{% endblock %}
